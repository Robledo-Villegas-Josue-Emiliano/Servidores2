services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo
      MYSQL_USER: app_web
      MYSQL_PASSWORD: ClaveApp123
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata:
